# Builds the runner for every platform and attaches the files to the release.
# Runs when a release is published; can be re-run by hand for an existing tag.
name: Build runner

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (e.g. v0.2.0)
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest    # inkplain-runner-setup-win-x64.exe
          - macos-latest      # inkplain-runner-mac-arm64.zip
          - macos-15-intel    # inkplain-runner-mac-x64.zip
          - ubuntu-latest     # inkplain-runner-linux-x64
          - ubuntu-24.04-arm  # inkplain-runner-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Each build embeds that machine's node binary, so it only runs on its own OS/arch.
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
